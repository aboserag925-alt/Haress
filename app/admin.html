<!DOCTYPE html>
<html lang="ar" dir="rtl" class="identity-v2 admin-v2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f9f5">
<title>إدارة المحاضرات | استراحة أهل الأثر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link href="identity-tokens.css" rel="stylesheet">
<link href="identity-v2.css" rel="stylesheet">
<script src="identity-v2.js" defer></script>

</head>
<body><main class="wrap">
<header><div><h1 class="admin-title"><img class="admin-mark" src="icon.svg" alt="">لوحة إدارة أهل الأثر</h1><p>إدارة المحاضرات ومواعيد البث والتسجيلات</p></div><a class="link" href="./"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18 9 12l6-6M9 12h12M3 4v16"/></svg>العودة للتطبيق</a></header>
<section class="panel" id="loginPanel"><h2>دخول المشرف</h2><p class="muted">يلزم حساب أُضيف مسبقًا إلى قائمة المشرفين في Supabase.</p><form id="loginForm" class="grid"><div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required></div><div class="field full"><button class="primary" type="submit"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3M21 3v18"/></svg>تسجيل الدخول</button></div></form><p class="status" id="loginStatus" role="status"></p></section>
<section class="panel" id="adminPanel" hidden>
<div class="admin-toolbar"><h2 id="formTitle">إضافة محاضرة جديدة</h2><button id="logoutBtn" type="button"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3M21 3v18"/></svg>تسجيل الخروج</button></div>
<form id="lectureForm">
<input id="lectureId" type="hidden">
<div class="grid">
<div class="field"><label for="title">عنوان المحاضرة *</label><input id="title" maxlength="180" required></div>
<div class="field"><label for="category">التصنيف</label><input id="category" maxlength="80" value="محاضرة"></div>
<div class="field"><label for="startsAt">موعد المحاضرة</label><input id="startsAt" type="datetime-local"></div>
<div class="field"><label for="status">حالة النشر</label><select id="status"><option value="draft">مسودة</option><option value="published">منشورة</option><option value="archived">أرشيف</option></select></div>
<div class="field"><label for="streamUrl">رابط البث (HTTPS)</label><input id="streamUrl" type="url" placeholder="https://..."></div>
<div class="field"><label for="recordingUrl">رابط التسجيل (HTTPS)</label><input id="recordingUrl" type="url" placeholder="https://..."></div>
<div class="field full"><label for="description">وصف المحاضرة</label><textarea id="description" maxlength="4000"></textarea></div>
</div><div class="actions"><button class="primary" type="submit" id="saveBtn"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h12l4 4v14H3V3h2ZM7 3v6h10V3M7 21v-8h10v8"/></svg><span>حفظ المحاضرة</span></button><button type="button" id="resetBtn"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg>تفريغ النموذج</button></div>
</form><p class="status" id="adminStatus" role="status"></p>
</section>
<section class="panel" id="listPanel" hidden><h2>مكتبة المحاضرات</h2><div class="stats" aria-label="ملخص المحاضرات"><div class="stat"><strong id="totalCount">0</strong><span>إجمالي المحاضرات</span></div><div class="stat"><strong id="publishedCount">0</strong><span>منشورة</span></div><div class="stat"><strong id="draftCount">0</strong><span>مسودات</span></div></div><div class="filters"><input id="lectureSearch" type="search" placeholder="ابحث بعنوان المحاضرة أو تصنيفها" aria-label="البحث في المحاضرات"><select id="statusFilter" aria-label="تصفية حسب حالة النشر"><option value="all">كل الحالات</option><option value="published">منشورة</option><option value="draft">مسودة</option><option value="archived">أرشيف</option></select></div><div class="items" id="lectureList"><p class="muted">جارٍ التحميل…</p></div></section>
</main>
<script src="runtime-config.js"></script><script src="supabase-config.js"></script><script src="auth-client.js"></script>
<script>
const $=id=>document.getElementById(id);
let apiBase=window.AHL_API_BASE_URL||'';while(apiBase.endsWith('/'))apiBase=apiBase.slice(0,-1);const api=apiBase+'/api/lectures';let items=[];
function status(id,message,error){$(id).textContent=message;$(id).classList.toggle('error',!!error)}
async function token(){const value=await window.ahlAuth.getAccessToken();if(!value)throw Error('انتهت جلسة الدخول. سجّل الدخول مجددًا.');return value}
async function request(url,options={}){const access=await token();const headers={...options.headers,'Content-Type':'application/json','Authorization':'Bearer '+access};if(window.AHL_SUPABASE_CONFIG&&window.AHL_SUPABASE_CONFIG.anonKey)headers.apikey=window.AHL_SUPABASE_CONFIG.anonKey;const response=await fetch(url,{...options,headers});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'تعذر تنفيذ الطلب');return data}
function resetForm(){$('lectureForm').reset();$('lectureId').value='';$('category').value='محاضرة';$('status').value='draft';$('formTitle').textContent='إضافة محاضرة جديدة';$('saveBtn').querySelector('span').textContent='حفظ المحاضرة'}
function fillForm(item){$('lectureId').value=item.id;$('title').value=item.title;$('category').value=item.category||'';$('description').value=item.description||'';$('streamUrl').value=item.stream_url||'';$('recordingUrl').value=item.recording_url||'';$('status').value=item.status;const startDate=item.starts_at?new Date(item.starts_at):null;$('startsAt').value=startDate&&Number.isFinite(startDate.getTime())?new Date(startDate.getTime()-startDate.getTimezoneOffset()*60000).toISOString().slice(0,16):'';$('formTitle').textContent='تعديل المحاضرة';$('saveBtn').querySelector('span').textContent='حفظ التعديلات';window.scrollTo({top:0,behavior:'smooth'})}
function render(){const list=$('lectureList');list.textContent='';$('totalCount').textContent=items.length;$('publishedCount').textContent=items.filter(item=>item.status==='published').length;$('draftCount').textContent=items.filter(item=>item.status==='draft').length;const query=$('lectureSearch').value.trim().toLocaleLowerCase('ar');const state=$('statusFilter').value;const visible=items.filter(item=>(state==='all'||item.status===state)&&(!query||[item.title,item.category,item.description].some(value=>String(value||'').toLocaleLowerCase('ar').includes(query))));if(!visible.length){list.textContent=items.length?'لا توجد نتائج مطابقة للبحث أو التصفية.':'لا توجد محاضرات بعد. أضف أول محاضرة من النموذج أعلاه.';return}visible.forEach(item=>{const article=document.createElement('article');article.className='item';const content=document.createElement('div');const title=document.createElement('h3');title.textContent=item.title;const meta=document.createElement('p');meta.textContent=(item.starts_at?new Date(item.starts_at).toLocaleString('ar-EG')+' · ':'')+(item.category||'محاضرة')+' · '+({published:'منشورة',draft:'مسودة',archived:'أرشيف'}[item.status]||item.status);content.append(title,meta);const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.type='button';edit.innerHTML='<svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5 5 5M4 20l4.5-1 11-11a2.1 2.1 0 0 0-3-3l-11 11L4 20Z"/></svg>تعديل';edit.onclick=()=>fillForm(item);const remove=document.createElement('button');remove.type='button';remove.innerHTML='<svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg>حذف';remove.className='danger';remove.onclick=async()=>{if(!confirm('هل تريد حذف هذه المحاضرة؟'))return;try{await request(api+'/'+item.id,{method:'DELETE'});await load()}catch(e){status('adminStatus',e.message,true)}};actions.append(edit,remove);article.append(content,actions);list.append(article)})}
async function load(){const result=await request(api.replace('/api/lectures','/api/admin/lectures'));items=result.items||[];render()}
$('loginForm').addEventListener('submit',async event=>{event.preventDefault();try{const result=await window.ahlAuth.signIn($('email').value.trim(),$('password').value);if(result.error)throw result.error;await showAdmin()}catch(error){status('loginStatus',error.message,true)}});
async function showAdmin(){try{await request(apiBase+'/api/admin/session');await load();$('loginPanel').hidden=true;$('adminPanel').hidden=false;$('listPanel').hidden=false;status('adminStatus','تم التحقق من صلاحيات المشرف.')}catch(error){status('loginStatus',error.message,true);await window.ahlAuth.signOut()}}
$('lectureForm').addEventListener('submit',async event=>{event.preventDefault();const id=$('lectureId').value;const starts=$('startsAt').value;const payload={title:$('title').value.trim(),category:$('category').value.trim(),description:$('description').value,starts_at:starts?new Date(starts).toISOString():null,stream_url:$('streamUrl').value.trim()||null,recording_url:$('recordingUrl').value.trim()||null,status:$('status').value};$('saveBtn').disabled=true;try{await request(id?api+'/'+id:api,{method:id?'PATCH':'POST',body:JSON.stringify(payload)});status('adminStatus','تم حفظ المحاضرة.');resetForm();await load()}catch(error){status('adminStatus',error.message,true)}finally{$('saveBtn').disabled=false}});
$('lectureSearch').addEventListener('input',render);$('statusFilter').addEventListener('change',render);$('resetBtn').onclick=resetForm;$('logoutBtn').onclick=async()=>{await window.ahlAuth.signOut();location.reload()};
if(!window.ahlAuth||!window.ahlAuth.configured){status('loginStatus','إعداد Supabase غير مكتمل. أضف الرابط والمفتاح العام إلى app/supabase-config.js.',true)}else{window.ahlAuth.init(state=>{if(state.user)showAdmin()})}
</script></body></html>
