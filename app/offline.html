<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070908">
<title>غير متصل — إستراحة أهل الأثر</title>
<meta name="description" content="صفحة عدم الاتصال بإستراحة أهل الأثر.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#070908;--surface:#101512;--gold:#c9a35b;--gold2:#f2d9a4;--text:#f5f1e7;--muted:#a9b0a6;--line:rgba(201,163,91,.25)}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Naskh Arabic',system-ui,sans-serif;display:grid;place-items:center;padding:24px}
.card{max-width:520px;width:100%;text-align:center;padding:36px 28px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#101512,#0a0d0b);box-shadow:0 18px 50px rgba(0,0,0,.4)}
.logo{width:84px;height:84px;border-radius:50%;border:1px solid var(--line);margin:0 auto 16px}
h1{margin:0 0 10px;font-size:26px;color:var(--gold2)}
p{margin:0 0 22px;color:var(--muted);line-height:1.9}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{font:inherit;font-weight:800;padding:12px 22px;border-radius:14px;border:1px solid transparent;cursor:pointer}
.primary{background:linear-gradient(135deg,#e6c681,var(--gold));color:#15130d}
.ghost{background:transparent;color:var(--gold2);border-color:var(--line)}
:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
</style>
</head>
<body>
<div class="card" role="status">
<img class="logo" src="icon.svg" alt="إستراحة أهل الأثر">
<h1>أنت غير متصل بالإنترنت</h1>
<p>الأذكار والأقسام المحفوظة متاحة، أما المحاضرات والأسئلة والبث المباشر فتستأنف تلقائيًا عند عودة الاتصال.</p>
<div class="actions">
<button class="primary" type="button" onclick="location.reload()">إعادة المحاولة</button>
<button class="ghost" type="button" onclick="location.href='./index.html'">فتح التطبيق</button>
</div>
</div>
</body>
</html>
