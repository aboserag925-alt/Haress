<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>حرس الحدود</title>
</head>
<body style="margin:0;padding:28px 12px;background:#f5f9f5;color:#18382d;font-family:Arial,Tahoma,sans-serif;direction:rtl;text-align:right">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;border:1px solid #dce8dd;border-radius:18px;background:#fff;overflow:hidden">
    <tr><td style="padding:24px 28px;background:#f5f9f5;border-bottom:3px solid #c5a04a;text-align:center">
      <div style="display:inline-block;min-width:142px;padding:13px 10px 20px;border:1px solid #c5a04a;border-radius:50% 50% 42% 42% / 28% 28% 72% 72%;background:#176b49;color:#fff;font-size:18px;font-weight:700;line-height:1.5">حرس الحدود</div>
      <div style="margin-top:8px;color:#63776b;font-size:13px">علم شرعي بمنهج أهل السنة</div>
    </td></tr>
    <tr><td style="padding:30px 28px 24px">
      <h1 style="margin:0 0 16px;color:#176b49;font-size:22px;line-height:1.5">رمز التحقق</h1>
      <p style="margin:0 0 22px;color:#43584b;font-size:16px;line-height:1.9">استخدم رمز التحقق التالي لإكمال العملية بأمان:</p>
      <p style="margin:26px 0;padding:16px;border:1px dashed #c5a04a;border-radius:12px;background:#f5f9f5;color:#176b49;text-align:center;font-size:28px;font-weight:700;letter-spacing:5px;direction:ltr">{{ .Token }}</p>
      <p style="margin:24px 0 0;color:#63776b;font-size:13px;line-height:1.8">إذا لم تطلب هذا الإجراء، يمكنك تجاهل هذه الرسالة بأمان.</p>
    </td></tr>
    <tr><td style="padding:16px 28px;border-top:1px solid #edf4ee;background:#f5f9f5;color:#63776b;font-size:12px;line-height:1.8;text-align:center">
      القرآن والسنة بفهم وأخلاق سلف الأمة
    </td></tr>
  </table>
</body>
</html>
