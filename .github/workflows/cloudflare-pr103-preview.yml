name: Cloudflare PR 103 Preview

on:
  push:
    branches:
      - fix/pre-launch-hardening-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hares-pr-103-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR 103 branch
        uses: actions/checkout@v4
        with:
          ref: fix/pre-launch-hardening-v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate preview credentials and Railway backend health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROXY_SHARED_SECRET: ${{ secrets.PROXY_SHARED_SECRET }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$PROXY_SHARED_SECRET"
          BACKEND_URL="$(node -e 'const fs = require("node:fs"); const config = JSON.parse(fs.readFileSync("wrangler.preview.jsonc", "utf8")); process.stdout.write(String(config.vars && config.vars.API_BACKEND_URL || ""));')"
          test -n "$BACKEND_URL"
          case "$BACKEND_URL" in
            https://*) ;;
            *) echo "Preview backend URL must use HTTPS." >&2; exit 1 ;;
          esac
          curl --fail --silent --show-error --retry 4 --retry-delay 3 --retry-all-errors --max-time 10 "$BACKEND_URL/api/health" >/dev/null

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build:app

      - name: Deploy isolated preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy --config wrangler.preview.jsonc

      - name: Set preview proxy secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROXY_SHARED_SECRET: ${{ secrets.PROXY_SHARED_SECRET }}
        run: |
          printf '%s' "$PROXY_SHARED_SECRET" | npx wrangler@4 secret put PROXY_SHARED_SECRET --config wrangler.preview.jsonc

      - name: Smoke test deployed preview and Railway CORS
        env:
          PREVIEW_URL: https://hares-pr-103-preview.aboserag925.workers.dev
        run: |
          set -eu
          BACKEND_URL="$(node -e 'const fs = require("node:fs"); const config = JSON.parse(fs.readFileSync("wrangler.preview.jsonc", "utf8")); process.stdout.write(String(config.vars && config.vars.API_BACKEND_URL || ""));')"
          node scripts/smoke-check.mjs --backend "$BACKEND_URL" --origin "$PREVIEW_URL"
          curl --fail --silent --show-error --retry 4 --retry-delay 3 --retry-all-errors --max-time 10 "$PREVIEW_URL/" >/dev/null
          curl --fail --silent --show-error --retry 4 --retry-delay 3 --retry-all-errors --max-time 10 "$PREVIEW_URL/api/health" | node -e 'let data = ""; process.stdin.setEncoding("utf8"); process.stdin.on("data", chunk => data += chunk); process.stdin.on("end", () => { if (JSON.parse(data).ok !== true) process.exit(1); });'
