name: Temporary Worker proxy secret set
on:
  push:
    branches: [maintenance/visual-v11-20261125]
    paths: [.github/workflows/secret-20261127.yml, ops/secret-mode.txt]
permissions:
  contents: read
concurrency:
  group: hares-secret-once
  cancel-in-progress: false
jobs:
  secret:
    if: github.repository == 'aboserag925-alt/Haress' && github.ref == 'refs/heads/maintenance/visual-v11-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Read live Worker, then check or set the proxy secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEW_SECRET: ${{ secrets.HARESS_PROXY_SECRET_20261127 }}
        shell: bash
        run: |
          MODE=$(cut -d' ' -f1 ops/secret-mode.txt)
          echo MODE=$MODE
          python - <<'PYPRE'
          import os,json,urllib.request,hashlib,email.parser,email.policy
          account=os.environ['CF_ACCOUNT']
          assert account=='9b34aacddb6334bb8c051f0d0e5670e2','Unexpected account'
          base='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/hares'
          token=os.environ['CF_TOKEN']
          def call(path=''):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(req,timeout=45) as r:return r.headers,r.read()
          def api(path=''):
              _,b=call(path);j=json.loads(b);assert j.get('success');return j['result']
          dep=api('/deployments')['deployments'][0]
          assert len(dep['versions'])==1 and dep['versions'][0]['percentage']==100
          live=dep['versions'][0]['version_id'];open('live-version.txt','w').write(live)
          ver=api('/versions/'+live)
          print('LIVE_VERSION',live)
          print('LIVE_BINDINGS',json.dumps([{k:v for k,v in b.items() if k!='text'} for b in ver['resources']['bindings']]))
          headers,body=call('/content/v2')
          m=email.parser.BytesParser(policy=email.policy.default).parsebytes(('Content-Type: '+headers['Content-Type']+'\r\n\r\n').encode()+body)
          parts=[p for p in m.iter_parts() if p.get_filename()=='index.js']
          sha=hashlib.sha256(parts[0].get_payload(decode=True)).hexdigest();print('LIVE_SCRIPT_SHA256',sha)
          assert sha=='aa453b70188ddc4930cf8e6e1cc27287f3f70b7738c45d963e17a03b9360fb65','Live script differs; abort'
          assert os.environ.get('NEW_SECRET'),'new secret missing'
          print('NEW_SECRET_LENGTH',len(os.environ['NEW_SECRET']))
          open('live-bindings.json','w').write(json.dumps(ver['resources']['bindings'],sort_keys=True))
          PYPRE
          if [ "$MODE" = "apply" ]; then
            printf '%s' "$NEW_SECRET" | npx --yes wrangler@4.168.0 secret put PROXY_SHARED_SECRET --name hares
            python - <<'PYPOST'
          import os,json,urllib.request,hashlib,email.parser,email.policy
          account=os.environ['CF_ACCOUNT'];token=os.environ['CF_TOKEN']
          base='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/hares'
          def call(path=''):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(req,timeout=45) as r:return r.headers,r.read()
          def api(path=''):
              _,b=call(path);j=json.loads(b);assert j.get('success');return j['result']
          oldb=json.load(open('live-bindings.json'))
          dep=api('/deployments')['deployments'][0];vid=dep['versions'][0]['version_id']
          print('NEW_VERSION',vid,dep['versions']);assert vid!=open('live-version.txt').read(),'No new version'
          assert len(dep['versions'])==1 and dep['versions'][0]['percentage']==100
          newb=api('/versions/'+vid)['resources']['bindings']
          key=lambda l:sorted(json.dumps(x,sort_keys=True) for x in l)
          sec=[b for b in newb if b['name']=='PROXY_SHARED_SECRET']
          assert [b['type'] for b in sec]==['secret_text'],'Secret binding missing'
          assert key([b for b in newb if b['name']!='PROXY_SHARED_SECRET'])==key([b for b in oldb if b['name']!='PROXY_SHARED_SECRET']),'Other bindings changed'
          headers,body=call('/content/v2')
          m=email.parser.BytesParser(policy=email.policy.default).parsebytes(('Content-Type: '+headers['Content-Type']+'\r\n\r\n').encode()+body)
          parts=[p for p in m.iter_parts() if p.get_filename()=='index.js']
          assert hashlib.sha256(parts[0].get_payload(decode=True)).hexdigest()=='aa453b70188ddc4930cf8e6e1cc27287f3f70b7738c45d963e17a03b9360fb65','Script changed'
          print('VERIFIED: only the secret binding was added; other bindings and script unchanged.')
          PYPOST
          fi
