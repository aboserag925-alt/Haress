name: test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: npm
      - run: npm clean-install
      - run: npm test
      - run: npm run build
      - run: npm run build:app
      - run: npm run check:secure
      - run: docker build --tag ahl-athar:verify .
