name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax across the website and server
        run: |
          find app server src assets cloudflare -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          find scripts cloudflare -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - run: npm test
      - run: npm run build:app
      - name: Verify GitHub Pages package
        env:
          AHL_API_BASE_URL: ""
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp index.html _site/404.html
          cp -R app assets screens _site/
          touch _site/.nojekyll
          node -e 'const fs = require("node:fs"); const value = (process.env.AHL_API_BASE_URL || "").trim().replace(/\/+$/, ""); if (value) { const url = new URL(value); if (url.protocol !== "https:" || url.origin !== value) throw new Error("AHL_API_BASE_URL must be an HTTPS origin without a trailing path."); } fs.writeFileSync("_site/runtime-config.js", "window.AHL_API_BASE_URL = " + JSON.stringify(value) + ";\n", "utf8"); fs.writeFileSync("_site/app/runtime-config.js", "window.AHL_API_BASE_URL = " + JSON.stringify(value) + ";\n", "utf8");'
          node --check _site/runtime-config.js
          node --check _site/app/runtime-config.js
          for asset in index.html 404.html app/tailwind.css app/supabase-config.js app/auth-client.js app/runtime-config.js app/manifest.json app/sw.js app/icon.svg app/apple-touch-icon.png assets/lectures.js assets/logo.jpg runtime-config.js; do
            test -s "_site/$asset" || { echo "Missing Pages asset: $asset" >&2; exit 1; }
          done
      - run: docker build --tag ahl-athar:verify .
      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          else
            git diff --check "$HEAD_SHA^" "$HEAD_SHA"
          fi
