name: Hares CI

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "integrate/**"
      - "chore/**"
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hares-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Install dependencies
        run: npm clean-install
      - name: Run complete test suite
        run: npm test
      - name: Run aggregate build
        run: npm run build
      - name: Run explicit app build
        run: npm run build:app
      - name: Audit production dependencies
        run: npm run check:secure
      - name: Build web application
        run: npm run build:app
      - name: Check whitespace
        run: git diff --check
      - name: Verify generated assets
        run: |
          test -s app/auth-client.js
          test -s app/supabase-config.js
          test -s app/tailwind.css
          test -s app/vendor/adhan.umd.min.js

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - test
      - secrets
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.secrets.result }}" = "success"
