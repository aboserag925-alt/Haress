name: Hares CI

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "integrate/**"
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hares-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run complete test suite
        run: npm test
      - name: Build web application
        run: npm run build:app
      - name: Run smoke check
        run: npm run smoke
      - name: Verify isolated V3 contract
        run: |
          node --check app/v3/v3.js
          node --check app/v3/v3-adapter.js
          node --check app/v3/v3-runtime.js
          node --check app/v3/sw.js
          node --test app/v3/v3-runtime.test.js
          node <<'NODE'
          const fs = require('node:fs');
          const base = fs.readFileSync('app/index.html', 'utf8');
          const v3 = fs.readFileSync('app/v3/index.html', 'utf8');
          const app = fs.readFileSync('app/app.js', 'utf8');
          const ids = (s) => [...s.matchAll(/\bid=["']([^"']+)["']/g)].map((m) => m[1]);
          const baseIds = ids(base);
          const v3Ids = ids(v3);
          const v3Set = new Set(v3Ids);
          const duplicates = v3Ids.filter((id, i) => v3Ids.indexOf(id) !== i);
          const missingIds = baseIds.filter((id) => !v3Set.has(id));
          const selectors = [...new Set([...app.matchAll(/getElementById\(['"]([^'"]+)['"]\)/g)].map((m) => m[1]))];
          const missingSelectors = selectors.filter((id) => !v3Set.has(id));
          if (duplicates.length || missingIds.length || missingSelectors.length) {
            throw new Error(JSON.stringify({ duplicates, missingIds, missingSelectors }));
          }
          if (!v3.includes('/v3/manifest.json') || !fs.existsSync('app/v3/manifest.json')) {
            throw new Error('V3 install manifest missing');
          }
          if (!v3.includes('/identity-tokens.css') || !v3.includes('/identity-v2.css')) {
            throw new Error('V3 shared V2 identity assets missing');
          }
          if (/tailwind\.css|visual-identity-v2|brand-motion|interactive-identity/.test(v3)) {
            throw new Error('V3 imports a legacy visual asset');
          }
          console.log('V3 contract OK: ' + baseIds.length + ' legacy IDs and ' + selectors.length + ' app.js selectors preserved');
          NODE
      - name: Restore generated-only assets
        run: git restore -- app/auth-client.js
      - name: Check whitespace
        run: git diff --check
      - name: Verify generated assets
        run: |
          test -s app/auth-client.js
          test -s app/supabase-config.js
          test -s app/identity-tokens.css
          test -s app/identity-v2.css
          test -s app/identity-v2.js
          test -s app/vendor/adhan.umd.min.js

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - test
      - secrets
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.secrets.result }}" = "success"
