name: Build and Deploy Cloudflare Worker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            node --test
          fi

      - name: Build application assets
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: npm run build:app

      - name: Verify generated Supabase configuration without exposing key
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const source = fs.readFileSync('app/supabase-config.js', 'utf8');
          const sandbox = { window: {} };
          vm.runInNewContext(source, sandbox, { timeout: 1000 });
          const config = sandbox.window.AHL_SUPABASE_CONFIG;
          if (!config?.url || !config?.anonKey) {
            console.error('Supabase build configuration is missing.');
            process.exit(1);
          }
          if (config.url !== 'https://uzepglfimareggswjzlf.supabase.co') {
            console.error('Supabase URL does not match the approved doc project.');
            process.exit(1);
          }
          console.log('Supabase URL and anon/publishable key are present; values withheld.');
          NODE

      - name: Generate version metadata and cache rules
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/write-version.mjs

      - name: Upload the exact build output for deployment
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-app-build
          path: app/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy production Worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://hares.aboserag925.workers.dev
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v4

      - name: Download the exact build output
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-app-build
          path: app/

      - name: Validate required Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing required GitHub secret: CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing required GitHub secret: CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Cloudflare deployment is blocked until required secrets are configured."
            exit 1
          fi

      - name: Deploy the verified build with Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify deployed version and Railway API health
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SITE_URL: https://hares.aboserag925.workers.dev
          RAILWAY_HEALTH_URL: https://haress-production.up.railway.app/api/health
        run: |
          expected="${EXPECTED_SHA:0:7}"
          actual=""
          for attempt in $(seq 1 12); do
            actual="$(curl --fail --silent --show-error "$SITE_URL/version.json" | jq -r '.sha // empty' 2>/dev/null || true)"
            if [ "$actual" = "$expected" ]; then
              break
            fi
            sleep 5
          done
          if [ "$actual" != "$expected" ]; then
            echo "Deployed version SHA mismatch: expected $expected, received ${actual:-empty}"
            exit 1
          fi
          echo "Cloudflare version verified: $actual"

          curl --fail --silent --show-error "$SITE_URL/supabase-config.js" -o /tmp/deployed-supabase-config.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const sandbox = { window: {} };
          vm.runInNewContext(fs.readFileSync('/tmp/deployed-supabase-config.js', 'utf8'), sandbox, { timeout: 1000 });
          const config = sandbox.window.AHL_SUPABASE_CONFIG;
          if (!config?.url || !config?.anonKey || config.url !== 'https://uzepglfimareggswjzlf.supabase.co') {
            console.error('Deployed Supabase browser configuration is missing or mismatched.');
            process.exit(1);
          }
          console.log('Deployed Supabase browser configuration verified; key withheld.');
          NODE

          curl --fail --silent --show-error "$RAILWAY_HEALTH_URL" |
            jq -e '.ok == true' >/dev/null
          echo "Railway /api/health verified."
