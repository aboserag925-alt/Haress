name: Build and Deploy Cloudflare Worker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test application
    environment:
      # PR builds must not receive Cloudflare deployment secrets from the Preview environment.
      # Production builds use Main only to read the public Supabase build inputs.
      name: ${{ github.event_name == 'pull_request' && 'Preview-Build-CI' || 'Main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production Worker configuration (dry run only)
        run: npx --yes wrangler@4 deploy --dry-run

      - name: Run test suite
        run: npm test

      - name: Validate Supabase build inputs
        env:
          SUPABASE_URL: ${{ github.event_name == 'pull_request' && 'https://bevyztwoijjzfngutnys.supabase.co' || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ github.event_name == 'pull_request' && 'sb_publishable_5GpifW0KcFuA_kEupjoByg_mMOdhrRH' || secrets.SUPABASE_PUBLISHABLE_KEY }}
          EXPECTED_SUPABASE_URL: ${{ github.event_name == 'pull_request' && 'https://bevyztwoijjzfngutnys.supabase.co' || 'https://uzepglfimareggswjzlf.supabase.co' }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing Supabase URL or publishable key in the selected GitHub Actions environment."
            exit 1
          fi
          if [ "$SUPABASE_URL" != "$EXPECTED_SUPABASE_URL" ]; then
            echo "Supabase URL does not match the approved project for this deployment context."
            exit 1
          fi

      - name: Build application assets
        env:
          SUPABASE_URL: ${{ github.event_name == 'pull_request' && 'https://bevyztwoijjzfngutnys.supabase.co' || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ github.event_name == 'pull_request' && 'sb_publishable_5GpifW0KcFuA_kEupjoByg_mMOdhrRH' || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build:app

      - name: Verify generated Supabase configuration without exposing key
        env:
          EXPECTED_SUPABASE_URL: ${{ github.event_name == 'pull_request' && 'https://bevyztwoijjzfngutnys.supabase.co' || 'https://uzepglfimareggswjzlf.supabase.co' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const source = fs.readFileSync('app/supabase-config.js', 'utf8');
          const sandbox = { window: {} };
          vm.runInNewContext(source, sandbox, { timeout: 1000 });
          const config = sandbox.window.AHL_SUPABASE_CONFIG;
          if (!config?.url || !config?.anonKey) {
            console.error('Supabase build configuration is missing.');
            process.exit(1);
          }
          if (config.url !== process.env.EXPECTED_SUPABASE_URL) {
            console.error('Supabase URL does not match the approved project for this context.');
            process.exit(1);
          }
          console.log('Supabase URL and publishable key are present; values withheld.');
          NODE

      - name: Upload built application assets
        uses: actions/upload-artifact@v4
        with:
          name: hares-app-assets
          path: app/
          if-no-files-found: error
          retention-days: 1

  deploy-preview:
    name: Deploy isolated Cloudflare Preview Worker
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Preview
    steps:
      - name: Check out pull request source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download tested application assets
        uses: actions/download-artifact@v4
        with:
          name: hares-app-assets
          path: app/

      - name: Validate Cloudflare Preview credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing Preview secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing Preview secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy preview Worker (never production)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.preview.jsonc

      - name: Verify preview HTTP response and fail-closed API
        env:
          PREVIEW_URL: https://hares-preview.aboserag925.workers.dev
        run: |
          page_status=$(curl --silent --show-error --output /tmp/preview.html --dump-header /tmp/preview.headers --write-out '%{http_code}' "$PREVIEW_URL/")
          test "$page_status" = "200" || { echo "Preview page returned HTTP $page_status"; exit 1; }
          grep -Eiq '^content-type: text/html' /tmp/preview.headers || { echo "Preview did not return HTML"; exit 1; }
          grep -Eiq "^x-content-type-options: nosniff" /tmp/preview.headers || { echo "Missing nosniff header"; exit 1; }
          grep -Eiq "content-security-policy:.*object-src 'none'" /tmp/preview.headers || { echo "Missing expected CSP directive"; exit 1; }
          api_status=$(curl --silent --show-error --output /tmp/preview-api.json --write-out '%{http_code}' "$PREVIEW_URL/api/health")
          test "$api_status" = "503" || { echo "Preview API should fail closed with HTTP 503 when no test backend is configured; got $api_status"; exit 1; }
          echo "Preview HTML, security headers, and fail-closed API behavior verified."

  deploy:
    name: Deploy production Worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://hares.aboserag925.workers.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download tested application assets
        uses: actions/download-artifact@v4
        with:
          name: hares-app-assets
          path: app/

      - name: Validate required Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing required GitHub secret: CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing required GitHub secret: CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Cloudflare deployment is blocked until required secrets are configured."
            exit 1
          fi

      - name: Deploy Worker with Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
