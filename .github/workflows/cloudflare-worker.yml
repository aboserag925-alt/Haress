name: Build and Deploy Cloudflare Worker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test application
    environment: Main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Validate Supabase build inputs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY in GitHub Actions secrets."
            echo "Configure both secrets for the repository before building the production frontend."
            exit 1
          fi
          if [ "$SUPABASE_URL" != "https://uzepglfimareggswjzlf.supabase.co" ]; then
            echo "SUPABASE_URL does not match the approved doc project."
            exit 1
          fi

      - name: Build application assets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build:app

      - name: Verify generated Supabase configuration without exposing key
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const source = fs.readFileSync('app/supabase-config.js', 'utf8');
          const sandbox = { window: {} };
          vm.runInNewContext(source, sandbox, { timeout: 1000 });
          const config = sandbox.window.AHL_SUPABASE_CONFIG;
          if (!config?.url || !config?.anonKey) {
            console.error('Supabase build configuration is missing.');
            process.exit(1);
          }
          if (config.url !== 'https://uzepglfimareggswjzlf.supabase.co') {
            console.error('Supabase URL does not match the approved doc project.');
            process.exit(1);
          }
          console.log('Supabase URL and anon/publishable key are present; values withheld.');
          NODE

      - name: Upload built application assets
        uses: actions/upload-artifact@v4
        with:
          name: hares-app-assets
          path: app/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy production Worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://hares.aboserag925.workers.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download tested application assets
        uses: actions/download-artifact@v4
        with:
          name: hares-app-assets
          path: app/

      - name: Validate required Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing required GitHub secret: CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing required GitHub secret: CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Cloudflare deployment is blocked until required secrets are configured."
            exit 1
          fi

      - name: Validate downloaded artifact contains required runtime configuration
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const source = fs.readFileSync('app/supabase-config.js', 'utf8');
          const sandbox = { window: {} };
          vm.runInNewContext(source, sandbox, { timeout: 1000 });
          const config = sandbox.window.AHL_SUPABASE_CONFIG;
          if (!config || !config.url || !config.anonKey) {
            console.error('Deploy blocked: downloaded artifact is missing required Supabase runtime configuration.');
            process.exit(1);
          }
          console.log('Deploy validation: required Supabase runtime configuration present in tested artifact; values withheld.');
          NODE

      - name: Deploy Worker with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy --config wrangler.jsonc

  preview:
    name: Cloudflare Preview (isolated validation, no production deploy)
    if: github.event_name == 'pull_request' && github.base_ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Isolated preview environment:
    # - No production secrets are referenced (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are production-only).
    # - No production Worker is modified.
    # - No automatic merge and no automatic production deployment.
    # - wrangler deploy is intentionally NOT invoked here: Cloudflare credentials / account
    #   permissions are not available in this environment, so preview deployment is blocked
    #   until those secrets are configured. See BLOCKER note below.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build application assets (preview; no production Supabase credentials)
        run: npm run build:app

      - name: Smoke check
        run: npm run smoke

      - name: Report Cloudflare preview deployment blocker
        run: |
          echo "BLOCKER: Cloudflare preview deployment is not performed in this job."
          echo "Reason: Cloudflare API token and account ID credentials are not available in this environment."
          echo "No wrangler deploy is executed, so no production Worker is modified and no secrets are exposed."
          echo "To enable preview deployment, configure repository Cloudflare credentials and add a guarded"
          echo "wrangler deploy step targeting a separate preview environment."
